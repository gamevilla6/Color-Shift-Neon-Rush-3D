kind = "web"
previewPath = "/"
title = "Color Swipe Runner"
description = "A fast, neon-lit 3D arcade runner where you shift between red, blue, and yellow to pass matching gates. Play with keyboard or touch, chase a high score, and restart instantly."
version = "1.0.0"
id = "artifacts/3d-game"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24982

[services.development]
run = "pnpm --filter @workspace/3d-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/3d-game", "run", "build" ]
serve = "static"
publicDir = "artifacts/3d-game/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24982"
BASE_PATH = "/"
